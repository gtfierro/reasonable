[package]
name = "reasonable"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# core stack (oxrdf/rio + friends)
rio_turtle.workspace = true
rio_api.workspace = true
oxrdf.workspace = true
datafrog.workspace = true
disjoint-sets.workspace = true
log.workspace = true
thiserror = "1.0"
quick-xml = "0.42"

[features]
default = ["prp-spo2"]
# RDF 1.2 (RDF-star) coexistence: enables a feature-gated match arm
# over `TermRef::Triple(_)` so `reasonable` compiles in workspaces that
# pull in `oxrdf` with its `rdf-12` feature enabled (e.g., alongside
# `shacl` 0.3.x via `rudof_rdf`). `reasonable` itself does not
# implement RDF-star reasoning; the arm panics if a quoted-triple term
# is encountered. Strictly additive when off.
rdf-12 = ["oxrdf/rdf-12"]
# OWL 2 RL rule `prp-spo2` (`owl:propertyChainAxiom`), general n-hop.
# Enabled by default. Pass `--no-default-features` to build a deliberately
# reduced engine without property-chain reasoning.
prp-spo2 = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false
path = "../benches/my_benchmark.rs"

[[bench]]
name = "property_chain"
harness = false
path = "../benches/property_chain.rs"

[profile.release]
debug = true

[package.metadata.maturin]
name = "reasonable"
