[package]
name = "pyreasonable"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "reasonable"
crate-type = ["cdylib"]

[dependencies]
oxrdf.workspace = true
reasonable.workspace = true
pyo3 = { version = "0.25", features = ["extension-module"]}
pyo3-ffi = { version = "0.25", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "0.25"

[features]
default = ["prp-spo2"]
abi3 = ["pyo3/abi3-py39"]
# Forward the engine's default-on prp-spo2 rule (owl:propertyChainAxiom,
# n-hop) through to the Python extension. Pass --no-default-features to
# deliberately build a wheel without property-chain reasoning.
prp-spo2 = ["reasonable/prp-spo2"]

#[package.metadata.maturin]
#name = "reasonable"

[package.metadata.deb]
# Debian package name (defaults to crate name, `pyreasonable`). Debian
# convention for a Python 3 module is `python3-<module>`.
name = "python3-reasonable"
maintainer = "Gabe Fierro <gtfierro@mines.edu>"
section = "python"
priority = "optional"
# Built as a stable-ABI (abi3) extension so a single binary works with any
# python3 the distribution ships, which is what installing into the unversioned
# `/usr/lib/python3/dist-packages` requires.
features = ["abi3"]
depends = "$auto, python3 (>= 3.9~), python3-rdflib (>= 6.1.1)"
extended-description = """
Python bindings for Reasonable, an OWL 2 RL reasoner implemented in Rust.
The `reasonable` module runs materialization over rdflib graphs or RDF
files (Turtle, N3) and returns the inferred triples as rdflib terms.
"""
# The default cdylib asset (/usr/lib/libreasonable.so) is not importable by
# Python, so lay the files out as a real `reasonable` package instead.
assets = [
    ["target/release/libreasonable.so", "usr/lib/python3/dist-packages/reasonable/reasonable.abi3.so", "644"],
    ["../reasonable/__init__.py", "usr/lib/python3/dist-packages/reasonable/__init__.py", "644"],
    ["README.md", "usr/share/doc/python3-reasonable/README.md", "644"],
]
